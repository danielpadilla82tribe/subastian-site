<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200"
     width="1200" height="1200" role="img" aria-labelledby="t d">
  <title id="t">Subastian conductor silhouette, hero pose</title>
  <desc id="d">Silhouette of a conductor in a top hat and tailcoat raising a glowing baton, backlit in purple with a gold rim light, subscription tiles arced behind him in a halo.</desc>
  <style>
    /* Retune the brand here; nothing else needs to change.
       If gold leaves the brand, set --gold to the same value as --purple-hi. */
    svg { --ink: #0A0814; --purple: #6D28D9; --purple-hi: #B296F5; --gold: #D4AF37; }
  </style>
  <defs>
    <radialGradient id="backlight" cx="50%" cy="42%" r="52%">
      <stop offset="0%"   stop-color="var(--purple)" stop-opacity="0.92"/>
      <stop offset="45%"  stop-color="var(--purple)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="var(--purple)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="var(--purple-hi)"/>
      <stop offset="100%" stop-color="var(--gold)"/>
    </linearGradient>
    <linearGradient id="baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="var(--gold)" stop-opacity="0.35"/>
      <stop offset="55%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="var(--purple-hi)"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="60%"  stop-color="var(--gold)"/>
      <stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"  x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/></filter>
    <!-- Directional rim: offset the union alpha, keep only what falls outside
         the original. Applied to the group, so interior seams never show. -->
    <filter id="rim-gold" x="-25%" y="-25%" width="150%" height="150%">
      <feOffset in="SourceAlpha" dx="9" dy="-8" result="o"/>
      <feFlood flood-color="#D4AF37" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="r"/>
      <feComposite in="r" in2="SourceAlpha" operator="out"/>
    </filter>
    <filter id="rim-cool" x="-25%" y="-25%" width="150%" height="150%">
      <feOffset in="SourceAlpha" dx="-7" dy="6" result="o"/>
      <feFlood flood-color="#B296F5" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="r"/>
      <feComposite in="r" in2="SourceAlpha" operator="out"/>
    </filter>
    <filter id="tight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/></filter>
    <g id="conductor">

    <path d="M 556 216 L 644 216 L 652 296 L 548 296 Z"/>
    <ellipse cx="600" cy="304" rx="74" ry="13"/>
    <path d="M 566 300 L 634 300 L 636 356
             C 634 392 622 408 600 410 C 578 408 566 392 564 356 Z"/>
    <path d="M 584 400 L 616 400 L 618 440 L 582 440 Z"/>
    <path d="M 590 428 C 552 434 528 450 514 476 L 498 566 L 486 704
             L 472 874 L 494 898 L 556 764 L 552 704 L 648 704 L 644 764
             L 706 898 L 728 874 L 714 704 L 702 566 L 686 476
             C 672 450 648 434 610 428 Z"/>
    <path d="M 552 690 L 596 690 L 592 1030 L 600 1052 L 538 1052 L 550 1030 Z"/>
    <path d="M 604 690 L 648 690 L 650 1030 L 662 1052 L 600 1052 L 608 1030 Z"/>
    <path d="M 556 446 L 528 458 L 504 560 L 496 660 L 520 664 L 532 570 L 554 478 Z"/>
    <path d="M 640 446 L 674 440 L 762 380 L 814 326 L 794 304 L 740 360 L 656 412 Z"/>
    </g>
  </defs>

  <!-- backlight: this is what separates the figure from a dark page -->
  <ellipse cx="600" cy="500" rx="430" ry="470" fill="url(#backlight)"/>

  <!-- subscription tiles -->
  <g>
    <g transform="translate(236,397) rotate(-19) translate(-25,-25)" opacity="0.26"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(285,285) rotate(-16) translate(-25,-25)" opacity="0.36"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(371,194) rotate(-14) translate(-25,-25)" opacity="0.46"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(485,137) rotate(-12) translate(-25,-25)" opacity="0.56"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(613,121) rotate(-10) translate(-25,-25)" opacity="0.26"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(739,146) rotate(-8) translate(-25,-25)" opacity="0.36"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(849,210) rotate(-5) translate(-25,-25)" opacity="0.46"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(928,306) rotate(-3) translate(-25,-25)" opacity="0.56"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
    <g transform="translate(968,421) rotate(-1) translate(-25,-25)" opacity="0.26"><rect width="50" height="50" rx="13.0" fill="none" stroke="url(#icon-edge)" stroke-width="2.8"/><rect x="13.0" y="21.0" width="24.0" height="7.5" rx="3.5" fill="url(#icon-edge)" opacity="0.7"/></g>
  </g>

  <!-- rim light: the same contour, offset, so gold shows only on the lit edge -->
  <use href="#conductor" filter="url(#rim-cool)" opacity="0.5"/>
  <use href="#conductor" filter="url(#rim-gold)"/>
  <use href="#conductor" fill="var(--ink)"/>

  <!-- baton -->
  <g stroke-linecap="round">
    <line x1="816" y1="312" x2="986" y2="190"
          stroke="var(--purple-hi)" stroke-width="22" opacity="0.55" filter="url(#soft)"/>
    <line x1="816" y1="312" x2="986" y2="190"
          stroke="url(#baton)" stroke-width="9" filter="url(#tight)"/>
    <line x1="816" y1="312" x2="986" y2="190"
          stroke="url(#baton)" stroke-width="4.5"/>
    <circle cx="986" cy="190" r="13" fill="#FFFFFF" opacity="0.9" filter="url(#tight)"/>
    <circle cx="986" cy="190" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- particles -->
  <g>
    <circle cx="950" cy="232" r="5" fill="url(#spark)" opacity="0.85"/>
    <circle cx="906" cy="282" r="3.4" fill="url(#spark)" opacity="0.78"/>
    <circle cx="1010" cy="164" r="3" fill="url(#spark)" opacity="0.71"/>
    <circle cx="870" cy="200" r="2.6" fill="url(#spark)" opacity="0.64"/>
    <circle cx="982" cy="292" r="2.4" fill="url(#spark)" opacity="0.57"/>
    <circle cx="842" cy="336" r="3" fill="url(#spark)" opacity="0.50"/>
    <circle cx="922" cy="154" r="2.2" fill="url(#spark)" opacity="0.43"/>
    <circle cx="1038" cy="240" r="2.8" fill="url(#spark)" opacity="0.36"/>
  </g>
</svg>
